name: Flutter native APK (0.01)
# rebuild marker: v2 — release + per-ABI split APKs (smaller downloads); publish all to release

# Builds the NATIVE Flutter rebuild of the mobile app (mobile/) — a real Flutter app
# with the preview player and export written in Kotlin/Media3 (no WebView). Installs
# ALONGSIDE the current Capacitor app (distinct appId com.easecutpro.easecut), so the
# working app is untouched while this is validated on-device.

on:
  workflow_dispatch:
  push:
    branches: [easecut0.01, claude/native-apk-build-status-7xxie2]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Accept Android licenses + ensure SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 || true

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build release APKs (per ABI — smaller downloads)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: List built APKs
        run: ls -la mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easecut-native-flutter-apks
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Publish to prerelease (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-flutter-0.01
          name: EaseCut — Native (Flutter) preview build
          prerelease: true
          body: |
            **Native Flutter rebuild** — first testable slice.

            This is the ground-up native app: the preview player is a hardware-decoded
            ExoPlayer rendered into a Flutter texture (no WebView, so the preview is
            glassy and never sticks), and export runs on the phone's Media3 hardware
            codecs.

            - **Download `app-arm64-v8a-release.apk`** (works on virtually all modern
              phones). Install it → allow "install from unknown sources" if prompted.
            - Installs **alongside** your current app (app name: "EaseCut Native",
              id `com.easecutpro.easecut`) — the existing app is untouched.
            - This slice: import a video → native preview with play / pause / scrub →
              native export to your gallery (Movies/EaseCutPro).
            - The full editor UI (timeline, captions, Cut Lord) is being built on top
              of this foundation next.
          files: mobile/build/app/outputs/flutter-apk/*-release.apk
