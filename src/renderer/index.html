<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- connect-src: the desktop-cloud hybrid talks to Supabase (auth, edge
         functions, storage, realtime wss) and Cloud Cowork's R2 presigned URLs,
         same origins vite.config.cloud.ts allows for the web build. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.r2.cloudflarestorage.com https://*.workers.dev; img-src 'self' data: blob: ecmedia:; media-src 'self' ecmedia: blob: data:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>EaseCutPro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
