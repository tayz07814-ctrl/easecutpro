# Supabase CLI project config (see CLOUD.md for the deploy steps).
project_id = "easecutpro"

# Both functions require a signed-in user; the gateway rejects anonymous calls
# before our code runs.
[functions.stt]
verify_jwt = true

[functions.llm-judge]
verify_jwt = true

# Creates a Stripe Checkout Session for the signed-in user, so it needs a valid
# Supabase JWT (the gateway rejects anonymous calls before our code runs).
[functions.stripe-checkout]
verify_jwt = true

# Creates a Stripe Customer Portal session (upgrade/downgrade/cancel) for the
# signed-in user — same JWT requirement as checkout.
[functions.stripe-portal]
verify_jwt = true

# Stripe calls this server-to-server with its own signature, not a Supabase JWT —
# verification must be OFF or the gateway rejects every webhook before our
# signature check. The function verifies STRIPE_WEBHOOK_SECRET itself.
[functions.stripe-webhook]
verify_jwt = false
