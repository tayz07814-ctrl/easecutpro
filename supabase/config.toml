# Supabase CLI project config (see CLOUD.md for the deploy steps).
project_id = "easecutpro"

# Both functions require a signed-in user; the gateway rejects anonymous calls
# before our code runs.
[functions.stt]
verify_jwt = true

[functions.llm-judge]
verify_jwt = true

# Paddle calls this server-to-server with its own HMAC signature, not a Supabase
# JWT — JWT verification must be OFF or the gateway rejects every webhook before
# our signature check runs. The function verifies PADDLE_WEBHOOK_SECRET itself.
[functions.paddle-webhook]
verify_jwt = false
