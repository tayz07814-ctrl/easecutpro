# Supabase CLI project config (see CLOUD.md for the deploy steps).
project_id = "easecutpro"

# Both functions require a signed-in user; the gateway rejects anonymous calls
# before our code runs.
[functions.stt]
verify_jwt = true

[functions.llm-judge]
verify_jwt = true

# easecut0.04 test branch only — the retake-editor prompt A/B. Isolated clone of
# ultracut-judge so the new prompt never touches main/production.
[functions.retake04-judge]
verify_jwt = true

# easecut0.04 — the "embudje" embedding judge: embeds the transcript, clusters
# retakes + flags production chatter, then a small LLM makes segment-level cuts.
[functions.embudje-judge]
verify_jwt = true
